# ШАБЛОН. Реальные значения → prod.enc.yaml (зашифрованный). Сам этот файл секретов не содержит.
#
#   sops edit infra/secrets/prod.enc.yaml   # файла нет → sops создаст его, откроет редактор,
#                                           # вставьте ключи отсюда со значениями; при сохранении зашифрует
# Либо зашифровать уже заполненный файл (НЕ внутри репозитория):
#   sops encrypt --filename-override infra/secrets/prod.enc.yaml ~/prod.yaml > infra/secrets/prod.enc.yaml
#
# Генерация значений (только [a-f0-9] — безопасно для URL postgres://user:PASSWORD@...):
#   openssl rand -hex 24   → DB_PASSWORD
#   openssl rand -hex 32   → SESSION_SECRET
DB_PASSWORD: ""
SESSION_SECRET: ""
# Необязательно: если образы в GHCR приватные — PAT с правом read:packages
GHCR_USER: ""
GHCR_TOKEN: ""
