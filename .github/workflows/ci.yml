name: CI

on:
  pull_request:
  push:
    branches: [main]

# Новый пуш в тот же PR отменяет предыдущий прогон — не тратим минуты на устаревший код.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint · Typecheck · Tests · Client
    runs-on: ubuntu-24.04
    # Настоящий Postgres рядом с раннером: интеграционные тесты идут против него, а не против моков.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: service_desk
          POSTGRES_PASSWORD: service_desk
          POSTGRES_DB: service_desk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U service_desk"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://service_desk:service_desk@localhost:5432/service_desk_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # версия pnpm берётся из packageManager в package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (строго по lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + integration tests
        run: pnpm test

      - name: API client is up to date
        # Генерируем клиент из текущего кода API. Если он отличается от закоммиченного —
        # кто-то поменял API и забыл `pnpm gen:client` → фронт собран против старого контракта.
        run: |
          pnpm gen:client
          git diff --exit-code -- packages/api-client || {
            echo "::error::packages/api-client устарел. Запустите 'pnpm gen:client' и закоммитьте изменения."
            exit 1
          }

  e2e:
    name: E2E (docker compose + Playwright)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter e2e

      - name: Start stack
        # --wait: ждём, пока все сервисы станут healthy (а migrate — завершится успешно)
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Seed demo users
        run: docker compose exec -T api node dist/seed.js

      - name: Install Chromium
        run: pnpm -F e2e exec playwright install --with-deps chromium

      - name: Playwright
        run: pnpm e2e
        env:
          CI: "true"
          BASE_URL: http://localhost:8080

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt

      - name: Upload Playwright trace & report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            e2e/test-results/
            e2e/playwright-report/
            compose-logs.txt
          retention-days: 7

      - name: Stop stack
        if: always()
        run: docker compose down -v

  docker-build:
    name: Docker build (no push)
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - image: api
            dockerfile: apps/api/Dockerfile
          - image: web
            dockerfile: infra/caddy/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # сканируем всю историю, а не только последний коммит
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
